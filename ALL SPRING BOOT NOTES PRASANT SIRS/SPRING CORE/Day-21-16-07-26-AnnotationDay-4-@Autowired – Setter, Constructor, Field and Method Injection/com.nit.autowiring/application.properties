<?xml version="1.0" encoding="UTF-8"?>

<beans xmlns="http://www.springframework.org/schema/beans"
       xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
       xmlns:context="http://www.springframework.org/schema/context"
       xsi:schemaLocation="
           http://www.springframework.org/schema/beans
           https://www.springframework.org/schema/beans/spring-beans.xsd
           http://www.springframework.org/schema/context
           https://www.springframework.org/schema/context/spring-context.xsd">

    <!-- Course Bean -->
    <bean id="course" class="com.sub.day21.Course">
        <property name="name" value="Spring Framework"/>
    </bean>

    <!-- Institute Bean -->
    <bean id="institute" class="com.sub.day21.Institute">
        <property name="name" value="Naresh IT"/>
    </bean>

    <!-- Student Bean -->
    <bean id="studentSetter" class="com.sub.day21.StudentSetterInjection"/>

    <!-- Enable @Autowired -->
    <context:annotation-config/>

</beans>
