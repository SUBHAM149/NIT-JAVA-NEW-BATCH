# ===============================
# Application Configuration
# ===============================

spring.application.name=SpringBoot_Project_21-SecurityWithSwagger


# Server Port
server.port=8080



# ===============================
# MySQL Database Configuration
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/securityempdb

spring.datasource.username=root

spring.datasource.password=Subham@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# ===============================
