<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<title>Employee List</title>


<style>
body {
	font-family: Arial, sans-serif;
	background: #f4f4f4;
}

.container {
	width: 90%;
	margin: 40px auto;
	background: white;
	padding: 20px;
	border-radius: 10px;
	box-shadow: 0px 0px 10px gray;
}

h2 {
	text-align: center;
	color: #333;
}

table {
	width: 100%;
	border-collapse: collapse;
	margin-top: 20px;
}

th {
	background: #007bff;
	color: white;
	padding: 12px;
}

td {
	padding: 10px;
	text-align: center;
	border-bottom: 1px solid #ddd;
}

a {
	text-decoration: none;
	padding: 8px 15px;
	border-radius: 5px;
	color: white;
}

.edit {
	background: green;
}

.delete {
	background: red;
}

.add {
	background: #007bff;
}

.logout {
	background: black;
}
</style>


</head>



<body>


	<div class="container">


		<h2>Employee List</h2>



		<a class="add" href="/employees/add"> Add Employee </a> &nbsp; <a
			class="logout" href="/logout"> Logout </a>



		<table>


			<tr>

				<th>ID</th>

				<th>Name</th>

				<th>Department</th>

				<th>Salary</th>

				<th>Action</th>

			</tr>



			<tr th:each="emp : ${employees}">


				<td th:text="${emp.id}"></td>


				<td th:text="${emp.name}"></td>


				<td th:text="${emp.department}"></td>


				<td th:text="${emp.salary}"></td>



				<td><a class="edit"
					th:href="@{/employees/edit/{id}(id=${emp.id})}"> Edit </a> <a
					class="delete" th:href="@{/employees/delete/{id}(id=${emp.id})}">
						Delete </a></td>


			</tr>


		</table>


	</div>


</body>


</html>
