<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Home</title>


<style>
body {
	font-family: Arial;
	background: #f4f4f4;
	text-align: center;
}

.container {
	margin-top: 100px;
	background: white;
	padding: 40px;
	width: 500px;
	margin-left: auto;
	margin-right: auto;
	border-radius: 10px;
	box-shadow: 0px 0px 10px gray;
}

h1 {
	color: #007bff;
}

a {
	display: inline-block;
	margin: 15px;
	padding: 10px 20px;
	background: #007bff;
	color: white;
	text-decoration: none;
	border-radius: 5px;
}

a:hover {
	background: #0056b3;
}

.logout {
	background: red;
}
</style>


</head>


<body>


	<div class="container">


		<h1>Welcome Employee Management System</h1>


		<p>Spring Boot + Spring Security + Thymeleaf</p>



		<a th:href="@{/employees}"> View Employees </a> <a class="logout"
			th:href="@{/logout}"> Logout </a>



	</div>


</body>

</html>
