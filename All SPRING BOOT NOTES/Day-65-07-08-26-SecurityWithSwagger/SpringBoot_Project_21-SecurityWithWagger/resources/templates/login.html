<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Employee Login</title>


<style>
body {
	font-family: Arial, sans-serif;
	background: #f2f2f2;
}

.login-box {
	width: 350px;
	margin: 100px auto;
	background: white;
	padding: 30px;
	border-radius: 10px;
	box-shadow: 0 0 10px gray;
}

h2 {
	text-align: center;
	color: #333;
}

input {
	width: 100%;
	padding: 10px;
	margin: 10px 0;
}

button {
	width: 100%;
	padding: 10px;
	background: #007bff;
	color: white;
	border: none;
	border-radius: 5px;
	cursor: pointer;
}

button:hover {
	background: #0056b3;
}
</style>

</head>


<body>


	<div class="login-box">


		<h2>Employee Login</h2>


		<form method="post" action="/login">


			<label>Username</label> <input type="text" name="username"
				placeholder="Enter username"> <label>Password</label> <input
				type="password" name="password" placeholder="Enter password">



			<button type="submit">Login</button>


		</form>


	</div>


</body>

</html>
