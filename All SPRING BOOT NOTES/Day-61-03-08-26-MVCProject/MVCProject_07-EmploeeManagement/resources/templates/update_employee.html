<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Update Employee</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>


<body>

	<div class="container mt-5">

		<h2 class="text-center mb-4">Update Employee</h2>


		<form th:action="@{/employees/update}" th:object="${employee}"
			method="post">


			<input type="hidden" th:field="*{id}">


			<div class="mb-3">

				<label>First Name</label> <input type="text" class="form-control"
					th:field="*{ename}"> <span class="text-danger"
					th:errors="*{ename}"> </span>

			</div>



			



			<div class="mb-3">

				<label>Email</label> <input type="email" class="form-control"
					th:field="*{email}"> <span class="text-danger"
					th:errors="*{email}"> </span>

			</div>



			<div class="mb-3">

				<label>Salary</label> <input type="number" class="form-control"
					th:field="*{salary}"> <span class="text-danger"
					th:errors="*{salary}"> </span>

			</div>



			<div class="mb-3">

				<label>Department</label> <input type="text" class="form-control"
					th:field="*{department}"> <span class="text-danger"
					th:errors="*{department}"> </span>

			</div>



			<button type="submit" class="btn btn-primary">Update
				Employee</button>


			<a th:href="@{/employees}" class="btn btn-secondary"> Back </a>


		</form>


	</div>


</body>

</html>
