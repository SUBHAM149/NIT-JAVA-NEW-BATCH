<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Employee List</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">Q

<link rel="stylesheet" th:href="@{/css/employee-list.css}">
</head>

<body>

	<div class="container mt-5">

		<h2 class="text-center mb-4">Employee Management System</h2>


		<a th:href="@{/employees/add}" class="btn btn-primary mb-3"> Add
			Employee </a>


		<table class="table table-bordered table-striped">

			<thead class="table-dark">

				<tr>
					<th>ID</th>
					<th>First Name</th>
					<th>Email</th>
					<th>Salary</th>
					<th>Department</th>
					<th>Action</th>
				</tr>

			</thead>


			<tbody>

				<tr th:each="employee : ${employees}">

					<td th:text="${employee.id}"></td>

					<td th:text="${employee.ename}"></td>

					<td th:text="${employee.email}"></td>

					<td th:text="${employee.salary}"></td>

					<td th:text="${employee.department}"></td>


					<td><a th:href="@{/employees/edit/{id}(id=${employee.id})}"
						class="btn btn-warning btn-sm"> Edit </a> <a
						th:href="@{/employees/delete/{id}(id=${employee.id})}"
						class="btn btn-danger btn-sm"
						onclick="return confirm('Delete Employee?')"> Delete </a></td>

				</tr>

			</tbody>

		</table>

	</div>

</body>

</html>
